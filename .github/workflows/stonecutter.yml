name: Stonecutter CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    name: Verify, test, build, and collect (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - fabric-26.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify the implemented Target matrix
        run: |
          test "$(tr -d '\r\n' < versions/current)" = "${{ matrix.target }}"
          test "${{ matrix.target }}" = "fabric-26.2"
      - name: Run the Stonecutter target lifecycle
        run: >-
          bash gradlew spotlessCheck verifyTargets testAll checkAll buildAll collectArtifacts
          --configuration-cache
          --configuration-cache-problems=fail
          --no-daemon
          --stacktrace
          --console=plain
      - name: Reuse the Gradle configuration cache
        run: >-
          bash gradlew spotlessCheck verifyTargets testAll checkAll buildAll collectArtifacts
          --configuration-cache
          --configuration-cache-problems=fail
          --no-daemon
          --stacktrace
          --console=plain
      - name: Verify the unique production artifact
        shell: bash
        run: |
          mapfile -t jars < <(find build/artifacts -type f -name '*.jar' -print | sort)
          test "${#jars[@]}" -eq 1
          test "${jars[0]}" = \
            "build/artifacts/fabric-26.2/generallaymansaestheticspyingscreen-8.0.0-alpha.1+fabric-26.2.jar"
      - name: Upload production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: glass-ci-build
          path: build/artifacts/**/*.jar
          if-no-files-found: error
      - name: Upload reports after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: glass-ci-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore

  planned-gates:
    name: Reject planned Target tasks (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - forge-1.20.1
          - neoforge-1.21.1
          - neoforge-26.1.2
          - neoforge-26.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Warm only the shared and implemented build logic
        run: >-
          bash gradlew help
          --configuration-cache
          --configuration-cache-problems=fail
          --no-daemon
          --stacktrace
          --console=plain
      - name: Verify planned Target fast-failure gates
        shell: bash
        run: |
          set -euo pipefail
          target='${{ matrix.target }}'
          loader="${target%%-*}"
          version="${target#*-}"
          expected="Target '$target' has status 'planned'"
          upgrade="Set [$loader.\"$version\"].target.status = \"implemented\""

          snapshot() {
            local directory="versions/$target/build"
            if [[ ! -d "$directory" ]]; then
              printf '<absent>'
              return
            fi
            find "$directory" -type f -printf '%P\t%s\t%T@\t' \
              -exec sha256sum '{}' \; | sort | sha256sum | cut -d' ' -f1
          }

          before="$(snapshot)"
          tasks=(
            assemble
            build
            check
            test
            classes
            compileJava
            processResources
            stonecutterGenerate
            stonecutterGenerateTest
            jar
            sourcesJar
            remapJar
            reobfJar
            runClient
            runServer
          )

          for task in "${tasks[@]}"; do
            log="$RUNNER_TEMP/${target}-${task}.log"
            set +e
            bash gradlew ":${target}:${task}" \
              --offline \
              --configuration-cache \
              --configuration-cache-problems=fail \
              --no-daemon \
              --stacktrace \
              --console=plain >"$log" 2>&1
            status=$?
            set -e

            if [[ $status -eq 0 ]]; then
              echo "Expected :${target}:${task} to fail." >&2
              cat "$log"
              exit 1
            fi
            grep -F "$expected" "$log" >/dev/null
            grep -F "$upgrade" "$log" >/dev/null

            unexpected="$(grep -E "^> Task :${target}:" "$log" || true)"
            if [[ -n "$unexpected" ]]; then
              echo "Unexpected planned Target task execution for :${target}:${task}:" >&2
              echo "$unexpected" >&2
              cat "$log"
              exit 1
            fi

            if grep -E \
              'Minecraft Maven|Renamer Gradle|net\.minecraftforge:forge|Parsed unknown MC version|createMinecraftArtifacts|net\.neoforged\.moddev' \
              "$log" >/dev/null; then
              echo "A planned Target entered a loader configuration or dependency path." >&2
              cat "$log"
              exit 1
            fi
          done

          after="$(snapshot)"
          test "$after" = "$before"
