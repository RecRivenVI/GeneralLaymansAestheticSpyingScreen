modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}_probe"
version = "${mod_version}"
displayName = "${mod_name} verification"
authors = "${mod_authors}"
description = "GLASS migration runtime verification"

[[mixins]]
config = "glass.performance.mixins.json"

[[dependencies.${mod_id}_probe]]
modId = "${mod_id}"
type = "required"
versionRange = "[${mod_version}]"
ordering = "AFTER"
side = "CLIENT"
