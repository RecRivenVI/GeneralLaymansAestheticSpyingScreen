modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = "${mod_description}"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${loader_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

[[mixins]]
config = "glass.mixins.json"

[[dependencies.${mod_id}]]
modId = "sable"
type = "optional"
versionRange = "[${sable_minimum},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "sodium"
type = "optional"
versionRange = "[${sodium_minimum},)"
ordering = "AFTER"
side = "CLIENT"
